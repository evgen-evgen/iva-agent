version: 1.3.16
cache: true

interface:
  customWelcome: "Iva"
  modelSelect: true
  parameters: false
  presets: false
  prompts:
    use: false
    create: false
    share: false
    public: false
  bookmarks: true
  multiConvo: false
  agents:
    use: false
    create: false
    share: false
    public: false
  marketplace:
    use: false
  mcpServers:
    use: false
    create: false
    share: false
    public: false
  skills:
    use: false
    create: false
    share: false
    public: false
    defaultActiveOnShare: false
  fileSearch: false
  webSearch: false
  runCode: false
  defaultPinnedTools: []

endpoints:
  agents:
    disableBuilder: true
    capabilities: []
  custom:
    - name: Iva
      apiKey: "${OPEN_WEBUI_API_KEY}"
      baseURL: "http://127.0.0.1:${IVA_PORT}/v1"
      headers:
        X-OpenWebUI-User-Id: "{{LIBRECHAT_USER_ID}}"
        X-OpenWebUI-User-Name: "{{LIBRECHAT_USER_NAME}}"
        X-OpenWebUI-Chat-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
      models:
        default: [iva]
        fetch: true
      titleConvo: false
      summarize: false
      modelDisplayLabel: Iva

memory:
  disabled: true

fileConfig:
  serverFileSizeLimit: 20
  endpoints:
    Iva:
      fileLimit: 10
      fileSizeLimit: 20
      totalSizeLimit: 25
      supportedMimeTypes:
        - ".*"
      defaultLLMDeliveryPath:
        fallback: provider

speech:
  stt:
    allowedAddresses:
      # This field is validated before ${IVA_PORT} interpolation.
      - "127.0.0.1:8700"
    openai:
      # Keep this literal in sync with IVA_PORT. LibreChat validates and uses the
      # STT address independently from the custom endpoint interpolation.
      url: "http://127.0.0.1:8700/v1/audio/transcriptions"
      apiKey: "${OPEN_WEBUI_API_KEY}"
      model: iva-transcribe
  speechTab:
    conversationMode: false
    advancedMode: false
    speechToText:
      engineSTT: external
      autoTranscribeAudio: false
      autoSendText: -1
    textToSpeech: false
