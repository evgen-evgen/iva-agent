services:
  librechat:
    profiles: ["librechat"]
    build:
      context: ./librechat
      args:
        IVA_PORT: ${IVA_PORT:-8723}
    image: iva-librechat-local
    container_name: iva-librechat
    network_mode: host
    depends_on:
      librechat-mongodb:
        condition: service_healthy
    environment:
      HOST: 127.0.0.1
      PORT: ${LIBRECHAT_PORT:-3080}
      DOMAIN_CLIENT: ${LIBRECHAT_PUBLIC_URL:-http://127.0.0.1:3080}
      DOMAIN_SERVER: ${LIBRECHAT_PUBLIC_URL:-http://127.0.0.1:3080}
      TRUST_PROXY: "1"
      MONGO_URI: mongodb://127.0.0.1:${LIBRECHAT_MONGO_PORT:-27018}/LibreChat
      CONFIG_PATH: /app/librechat.yaml
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:?Set OPEN_WEBUI_API_KEY in .env}
      LIBRECHAT_NOTIFICATION_SECRET: ${LIBRECHAT_NOTIFICATION_SECRET:?Set LIBRECHAT_NOTIFICATION_SECRET in .env}
      IVA_PORT: ${IVA_PORT:-8723}
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_REGISTRATION: "false"
      ALLOW_SOCIAL_LOGIN: "false"
      ALLOW_SOCIAL_REGISTRATION: "false"
      NO_INDEX: "true"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./data/librechat-images:/app/client/public/images
      - librechat-data:/app/data
      - librechat-uploads:/app/uploads
      - librechat-logs:/app/logs
    restart: unless-stopped

  librechat-mongodb:
    profiles: ["librechat"]
    image: mongo:8.0.20
    container_name: iva-librechat-mongodb
    network_mode: host
    command:
      - mongod
      - --noauth
      - --bind_ip
      - 127.0.0.1
      - --port
      - ${LIBRECHAT_MONGO_PORT:-27018}
    healthcheck:
      test:
        - CMD-SHELL
        - "mongosh --quiet --port ${LIBRECHAT_MONGO_PORT:-27018} --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - librechat-mongodb:/data/db
    restart: unless-stopped

volumes:
  librechat-data:
  librechat-uploads:
  librechat-logs:
  librechat-mongodb:
