services:
  librechat:
    profiles: ["librechat"]
    build:
      context: ./librechat
      args:
        IVA_PORT: ${IVA_PORT:-8723}
    image: iva-librechat-local
    container_name: iva-librechat
    network_mode: host
    depends_on:
      librechat-mongodb:
        condition: service_healthy
    environment:
      HOST: 127.0.0.1
      PORT: ${LIBRECHAT_PORT:-3080}
      DOMAIN_CLIENT: ${LIBRECHAT_PUBLIC_URL:-http://127.0.0.1:3080}
      DOMAIN_SERVER: ${LIBRECHAT_PUBLIC_URL:-http://127.0.0.1:3080}
      TRUST_PROXY: "1"
      MONGO_URI: mongodb://127.0.0.1:${LIBRECHAT_MONGO_PORT:-27018}/LibreChat
      CONFIG_PATH: /app/librechat.yaml
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:?Set OPEN_WEBUI_API_KEY in .env}
      LIBRECHAT_NOTIFICATION_SECRET: ${LIBRECHAT_NOTIFICATION_SECRET:?Set LIBRECHAT_NOTIFICATION_SECRET in .env}
      LIBRECHAT_NOTIFICATION_USERS: ${LIBRECHAT_NOTIFICATION_USERS:-}
      IVA_PORT: ${IVA_PORT:-8723}
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_REGISTRATION: "false"
      ALLOW_SOCIAL_LOGIN: "false"
      ALLOW_SOCIAL_REGISTRATION: "false"
      NO_INDEX: "true"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./data/librechat-images:/app/client/public/images
      - librechat-data:/app/data
      - librechat-uploads:/app/uploads
      - librechat-logs:/app/logs
    restart: unless-stopped

  librechat-mongodb:
    profiles: ["librechat"]
    image: mongo:8.0.20
    container_name: iva-librechat-mongodb
    network_mode: host
    command:
      - mongod
      - --noauth
      - --bind_ip
      - 127.0.0.1
      - --port
      - ${LIBRECHAT_MONGO_PORT:-27018}
    healthcheck:
      test:
        - CMD-SHELL
        - "mongosh --quiet --port ${LIBRECHAT_MONGO_PORT:-27018} --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - librechat-mongodb:/data/db
    restart: unless-stopped

  ceo-postgres:
    profiles: ["iva-data"]
    image: postgres:18
    container_name: iva-ceo-postgres
    environment:
      POSTGRES_DB: iva_metadata
      POSTGRES_USER: iva
      POSTGRES_PASSWORD: ${IVA_POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:${IVA_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iva -d iva_metadata"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ceo-postgres:/var/lib/postgresql
    restart: unless-stopped

  ceo-archive:
    profiles: ["iva-data"]
    image: dxflrs/garage:v2.3.0
    container_name: iva-ceo-archive
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${IVA_ARCHIVE_ACCESS_KEY:-}
      GARAGE_DEFAULT_SECRET_KEY: ${IVA_ARCHIVE_SECRET_KEY:-}
      GARAGE_DEFAULT_BUCKET: ${IVA_ARCHIVE_BUCKET:-iva-archive}
    ports:
      - "127.0.0.1:${IVA_ARCHIVE_PORT:-3900}:3900"
    volumes:
      - ./data/garage/garage.toml:/etc/garage.toml:ro
      - ceo-archive-meta:/var/lib/garage/meta
      - ceo-archive-data:/var/lib/garage/data
    restart: unless-stopped

volumes:
  librechat-data:
  librechat-uploads:
  librechat-logs:
  librechat-mongodb:
  ceo-postgres:
  ceo-archive-meta:
  ceo-archive-data:
